<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge Your Fate</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-container">

        <h1>FORGE YOUR FATE</h1>

        <p class="subtitle">Every spin creates your destiny.</p>

        <section id="identity-screen">

            <h2>Who are you?</h2>

            <div class="gender-options">

                <button class="gender-btn" data-gender="male">
                    ♂
                    <span>Male</span>
                </button>

                <button class="gender-btn" data-gender="female">
                    ♀
                    <span>Female</span>
                </button>

                <button class="gender-btn" data-gender="other">
                    ⚧
                    <span>Other</span>
                </button>

            </div>

            <button id="continue-btn" disabled>
                CONTINUE
            </button>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
